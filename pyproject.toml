[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmqa"
version = "0.2.0"
description = "A measurable, fairness-aware retrieval-augmented question-answering application"
readme = "readme.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Wei-Han Tu" }]
dependencies = [
    "certifi>=2025.8.3",
    "docx2txt>=0.9,<1",
    "faiss-cpu>=1.12,<2",
    "numpy>=1.26,<3",
    "openai>=1.100,<3",
    "pypdf>=5,<7",
    "streamlit>=1.48,<2",
    "tiktoken>=0.9,<1",
]

[project.scripts]
llmqa = "llmqa.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmqa"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["llmqa"]
