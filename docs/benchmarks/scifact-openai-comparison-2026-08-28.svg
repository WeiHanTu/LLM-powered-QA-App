<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">SciFact retrieval benchmark comparison</title><desc id="desc">Recall, reciprocal rank, and NDCG for BM25, dense, dense plus MMR, and hybrid RRF with 95 percent query-bootstrap confidence intervals.</desc><rect width="1200" height="690" rx="20" fill="#f8fafc"/><text x="60" y="58" font-family="system-ui, sans-serif" font-size="28" fill="#0f172a" font-weight="700">SciFact retrieval quality</text><text x="60" y="88" font-family="system-ui, sans-serif" font-size="16" fill="#475569">Full 5,183-document / 300-query test run · OpenAI text-embedding-3-small (1536d) · 2026-08-28</text><rect x="74" y="126" width="350" height="390" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="98" y="166" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a" font-weight="650">Recall@10</text><line x1="186.0" y1="190" x2="186.0" y2="456" stroke="#e2e8f0"/><text x="186.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.50</text><line x1="233.5" y1="190" x2="233.5" y2="456" stroke="#e2e8f0"/><text x="233.5" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.60</text><line x1="281.0" y1="190" x2="281.0" y2="456" stroke="#e2e8f0"/><text x="281.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.70</text><line x1="328.5" y1="190" x2="328.5" y2="456" stroke="#e2e8f0"/><text x="328.5" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.80</text><line x1="376.0" y1="190" x2="376.0" y2="456" stroke="#e2e8f0"/><text x="376.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.90</text><text x="96" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#334155">BM25</text><line x1="298.9" y1="220" x2="342.1" y2="220" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><circle cx="321.0" cy="220" r="7" fill="#64748b" stroke="#ffffff" stroke-width="2"/><text x="401" y="225" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.784</text><text x="96" y="295" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dense</text><line x1="335.0" y1="290" x2="371.7" y2="290" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="353.9" cy="290" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="401" y="295" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.854</text><text x="96" y="365" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dense + MMR</text><line x1="314.7" y1="360" x2="355.4" y2="360" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><circle cx="335.8" cy="360" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="401" y="365" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.815</text><text x="96" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Hybrid RRF</text><line x1="327.5" y1="430" x2="366.1" y2="430" stroke="#059669" stroke-width="4" stroke-linecap="round"/><circle cx="347.3" cy="430" r="7" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="401" y="435" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.840</text><rect x="457" y="126" width="350" height="390" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="481" y="166" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a" font-weight="650">MRR@10</text><line x1="569.0" y1="190" x2="569.0" y2="456" stroke="#e2e8f0"/><text x="569.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.50</text><line x1="616.5" y1="190" x2="616.5" y2="456" stroke="#e2e8f0"/><text x="616.5" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.60</text><line x1="664.0" y1="190" x2="664.0" y2="456" stroke="#e2e8f0"/><text x="664.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.70</text><line x1="711.5" y1="190" x2="711.5" y2="456" stroke="#e2e8f0"/><text x="711.5" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.80</text><line x1="759.0" y1="190" x2="759.0" y2="456" stroke="#e2e8f0"/><text x="759.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.90</text><text x="479" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#334155">BM25</text><line x1="605.8" y1="220" x2="651.4" y2="220" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><circle cx="628.7" cy="220" r="7" fill="#64748b" stroke="#ffffff" stroke-width="2"/><text x="784" y="225" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.626</text><text x="479" y="295" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dense</text><line x1="633.4" y1="290" x2="676.3" y2="290" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="654.5" cy="290" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="784" y="295" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.680</text><text x="479" y="365" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dense + MMR</text><line x1="626.6" y1="360" x2="671.3" y2="360" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><circle cx="648.8" cy="360" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="784" y="365" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.668</text><text x="479" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Hybrid RRF</text><line x1="637.2" y1="430" x2="680.2" y2="430" stroke="#059669" stroke-width="4" stroke-linecap="round"/><circle cx="658.8" cy="430" r="7" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="784" y="435" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.689</text><rect x="840" y="126" width="350" height="390" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="864" y="166" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a" font-weight="650">NDCG@10</text><line x1="952.0" y1="190" x2="952.0" y2="456" stroke="#e2e8f0"/><text x="952.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.50</text><line x1="999.5" y1="190" x2="999.5" y2="456" stroke="#e2e8f0"/><text x="999.5" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.60</text><line x1="1047.0" y1="190" x2="1047.0" y2="456" stroke="#e2e8f0"/><text x="1047.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.70</text><line x1="1094.5" y1="190" x2="1094.5" y2="456" stroke="#e2e8f0"/><text x="1094.5" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.80</text><line x1="1142.0" y1="190" x2="1142.0" y2="456" stroke="#e2e8f0"/><text x="1142.0" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.90</text><text x="862" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#334155">BM25</text><line x1="1006.6" y1="220" x2="1049.5" y2="220" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><circle cx="1028.1" cy="220" r="7" fill="#64748b" stroke="#ffffff" stroke-width="2"/><text x="1167" y="225" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.660</text><text x="862" y="295" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dense</text><line x1="1035.3" y1="290" x2="1074.4" y2="290" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="1054.8" cy="290" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="1167" y="295" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.716</text><text x="862" y="365" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Dense + MMR</text><line x1="1024.0" y1="360" x2="1065.8" y2="360" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><circle cx="1044.8" cy="360" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="1167" y="365" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.695</text><text x="862" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Hybrid RRF</text><line x1="1036.8" y1="430" x2="1077.1" y2="430" stroke="#059669" stroke-width="4" stroke-linecap="round"/><circle cx="1057.2" cy="430" r="7" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="1167" y="435" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end">0.721</text><text x="60" y="560" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" font-weight="650">Interpretation</text><text x="60" y="588" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Dense leads Recall@10; hybrid RRF leads MRR@10 and NDCG@10. MMR reduces all three metrics at this configuration.</text><text x="60" y="625" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Dots are means; lines are 95% nonparametric query-bootstrap intervals (10,000 resamples, fixed seed). Axis begins at 0.50.</text><text x="60" y="650" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">These intervals describe SciFact query variation—not production uncertainty. Search latency and API cost are separate concerns.</text></svg>
