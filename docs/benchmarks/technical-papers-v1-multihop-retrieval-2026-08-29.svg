<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Multi-hop retrieval comparison</title><desc id="desc">BM25 compared with question decomposition and reciprocal-rank fusion on fifteen reviewed multi-hop questions.</desc><rect width="1120" height="610" rx="20" fill="#f8fafc"/><text x="54" y="56" font-family="system-ui, sans-serif" font-size="28" fill="#0f172a" font-weight="700">Multi-hop retrieval experiment</text><text x="54" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#475569">15 reviewed cases · top 10 · one frozen decomposition + RRF configuration</text><text x="54" y="150" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="650">Full locator coverage</text><text x="54" y="186" font-family="system-ui, sans-serif" font-size="13" fill="#475569">BM25</text><rect x="190" y="168" width="253.3" height="22" rx="5" fill="#64748b"/><text x="970" y="186" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="650">33.3%</text><text x="54" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Decomposed + RRF</text><rect x="190" y="202" width="304.0" height="22" rx="5" fill="#2563eb"/><text x="970" y="220" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="650">40.0%</text><text x="54" y="270" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="650">Evidence-locator hit rate</text><text x="54" y="306" font-family="system-ui, sans-serif" font-size="13" fill="#475569">BM25</text><rect x="190" y="288" width="431.8" height="22" rx="5" fill="#64748b"/><text x="970" y="306" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="650">56.8%</text><text x="54" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Decomposed + RRF</text><rect x="190" y="322" width="431.8" height="22" rx="5" fill="#2563eb"/><text x="970" y="340" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="650">56.8%</text><text x="54" y="390" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="650">Generation task pass (automated judge)</text><text x="54" y="426" font-family="system-ui, sans-serif" font-size="13" fill="#475569">BM25</text><rect x="190" y="408" width="354.7" height="22" rx="5" fill="#64748b"/><text x="970" y="426" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="650">46.7%</text><text x="54" y="460" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Decomposed + RRF</text><rect x="190" y="442" width="304.0" height="22" rx="5" fill="#2563eb"/><text x="970" y="460" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="650">40.0%</text><text x="54" y="525" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" font-weight="650">Paired endpoint: 2 gains, 1 loss, 12 ties · exact p=1.0000</text><text x="54" y="558" font-family="system-ui, sans-serif" font-size="14" fill="#334155">retain BM25 as the default retriever</text><text x="54" y="586" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Generation uses separate API calls and an automated same-model judge; no human adjudication.</text></svg>
